<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enviar Anamnesis - Interárea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand fw-bold">Interárea – Enviar Anamnesis</span>
        </div>
    </nav>

    <div class="container py-3">
        <div class="progress mb-4" style="height: 10px; background-color: #343a40;">
            <div class="progress-bar bg-success" id="progress-bar" role="progressbar" style="width: 20%"></div>
        </div>

        <form id="anamnesisForm">
            <!-- Paso 1: Motivo -->
            <div class="form-step active" id="step1">
                <h4 class="mb-3">1. Motivo de derivación</h4>
                <div class="mb-3">
                    <textarea class="form-control form-control-lg bg-light text-dark" rows="3"
                        placeholder="Ej: Trauma craneal, dolor torácico, convulsión..." required></textarea>
                </div>
                <button type="button" class="btn btn-success btn-lg w-100" onclick="nextStep(1,2)">Siguiente →</button>
            </div>

            <!-- Paso 2: Síntomas -->
            <div class="form-step" id="step2" style="display:none;">
                <h4 class="mb-3">2. Síntomas actuales</h4>
                <div class="mb-3">
                    <textarea class="form-control form-control-lg bg-light text-dark" rows="3"
                        placeholder="Inicio, evolución, intensidad"></textarea>
                </div>
                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-outline-light btn-lg" onclick="prevStep(2,1)">←
                        Anterior</button>
                    <button type="button" class="btn btn-success btn-lg" onclick="nextStep(2,3)">Siguiente →</button>
                </div>
            </div>

            <!-- Paso 3: Antecedentes médicos -->
            <div class="form-step" id="step3" style="display:none;">
                <h4 class="mb-3">3. Antecedentes médicos</h4>
                <div class="mb-3">
                    <textarea class="form-control form-control-lg bg-light text-dark" rows="2"
                        placeholder="HTA, diabetes, alergias, cirugías..."></textarea>
                </div>
                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-outline-light btn-lg" onclick="prevStep(3,2)">←
                        Anterior</button>
                    <button type="button" class="btn btn-success btn-lg" onclick="nextStep(3,4)">Siguiente →</button>
                </div>
            </div>

            <!-- Paso 4: Unidad destino -->
            <div class="form-step" id="step4" style="display:none;">
                <h4 class="mb-3">4. Unidad destino</h4>
                <div class="mb-3">
                    <select class="form-select form-select-lg bg-light text-dark" required>
                        <option value="">Seleccionar...</option>
                        <option>Urgencia traumatológica adulto HRFRZ</option>
                        <option>Traumatología Infantil HRFRZ</option>
                        <option>Telered Urgencias O’Higgins</option>
                        <option>Derivaciones área norte RIUE</option>
                        <option>Ambulancia RIU</option>
                        <option>Derivaciones SAR Oriente</option>
                        <option>Urgencia Carretera de la fruta</option>
                        <option>Red Integrada Santa Cruz</option>
                        <option>Telered San Fernando adulto</option>
                        <option>Telered San Fernando pediatría</option>
                        <option>Red Cachapoal SUR</option>
                    </select>
                </div>
                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-outline-light btn-lg" onclick="prevStep(4,3)">←
                        Anterior</button>
                    <button type="button" class="btn btn-success btn-lg" onclick="nextStep(4,5)">Siguiente →</button>
                </div>
            </div>

            <!-- Paso 5: Confirmación -->
            <div class="form-step" id="step5" style="display:none;">
                <h4 class="mb-3">Confirmar envío</h4>
                <div class="alert alert-info text-dark">
                    <p><strong>Ubicación GPS:</strong> -34.1709, -70.7447 (autodetectada)</p>
                    <p><strong>Unidad origen:</strong> Red Cachapoal SUR</p>
                    <p><strong>Hora:</strong> 06:23 hrs</p>
                </div>
                <p class="text-muted">¿Está todo correcto? El envío es irreversible.</p>
                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-outline-light btn-lg" onclick="prevStep(5,4)">← Editar</button>
                    <button type="submit" class="btn btn-success btn-lg">📤 ENVIAR ANAMNESIS AHORA</button>
                </div>
            </div>
        </form>
    </div>

    <script>
        const totalSteps = 5;
        let currentStep = 1;

        function updateProgress() {
            const percent = (currentStep / totalSteps) * 100;
            document.getElementById('progress-bar').style.width = percent + '%';
        }

        function showStep(stepId) {
            document.querySelectorAll('.form-step').forEach(el => el.style.display = 'none');
            document.getElementById('step' + stepId).style.display = 'block';
        }

        function nextStep(from, to) {
            showStep(to);
            currentStep = to;
            updateProgress();
        }

        function prevStep(from, to) {
            showStep(to);
            currentStep = to;
            updateProgress();
        }

        // Simular GPS
        window.onload = function () {
            const gps = document.querySelector('.alert p:first-child');
            if (gps) gps.innerHTML = `<strong>Ubicación GPS:</strong> ${(-34.1700 + Math.random() * 0.01).toFixed(4)}, ${(-70.7400 + Math.random() * 0.01).toFixed(4)} (autodetectada)`;
        };
    </script>
</body>

</html>
