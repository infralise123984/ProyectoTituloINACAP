<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Interárea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">
    <main class="container">
        <section class="vh-100 d-flex justify-content-center align-items-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                <div class="card bg-secondary text-white border-light" style="border-radius: 1rem;">
                    <div class="card-body p-4 text-center">
                        <h2 class="fw-bold mb-3 text-uppercase">Login</h2>
                        <p class="text-white-75 mb-4">Ingresa tu usuario y contraseña</p>

                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3 text-start">
                                <label for="username" class="form-label">Usuario</label>
                                <input type="text" class="form-control form-control-lg bg-dark text-white" id="username"
                                    name="username" required>
                            </div>
                            <div class="mb-3 text-start">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control form-control-lg bg-dark text-white"
                                    id="password" name="password" required>
                            </div>
                            <p class="small mb-4 text-end">
                                <a href="#" class="text-white-50">Olvidé mi contraseña</a>
                            </p>
                            <button type="submit" class="btn btn-outline-light btn-lg px-5 w-100">Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
